name: Notify via custom curl

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post Discord release notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ROLES_TO_PING: "<@&1389478053712892065> <@&1389477717304545350>"
        run: |
          # Build JSON safely; toJson ensures proper escaping for the release body
          read -r -d '' PAYLOAD <<'JSON'
          {
            "content": ${{ toJson(env.ROLES_TO_PING) }},
            "embeds": [{
              "title": ${{ toJson(format('🚀 Release {0}', github.event.release.tag_name)) }},
              "description": ${{ toJson(github.event.release.body) }},
              "url": ${{ toJson(github.event.release.html_url) }},
              "color": 3066993,
              "timestamp": ${{ toJson(github.event.release.published_at) }}
            }],
            "allowed_mentions": {
              "roles": ["1389478053712892065", "1389477717304545350"]
            }
          }
          JSON

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "$DISCORD_WEBHOOK"
