#
name: Deploy Docker apl-server and apl-storage Image

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
env:
  SERVER_IMG_NAME: apl-server
  STORAGE_IMG_NAME: apl-storage
jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build server
        run: docker build ./apl-server --file ./apl-server/apl-prod.Dockerfile --tag $SERVER_IMG_NAME --label "runnumber=${GITHUB_RUN_ID}"

      - name: Build storage
        run: docker build ./apl-server --file ./apl-server/storage-prod.Dockerfile --tag $STORAGE_IMG_NAME --label "runnumber=${GITHUB_RUN_ID}"

      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push server
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/$SERVER_IMG_NAME

          # This changes all uppercase characters to lowercase.
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          # This strips the git ref prefix from the version.
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          # This strips the "v" prefix from the tag name.
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
          # This uses the Docker `latest` tag convention.
          [ "$VERSION" == "main" ] && VERSION=latest
          echo IMAGE_ID=$IMAGE_ID
          echo VERSION=$VERSION
          docker tag $SERVER_IMG_NAME $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION

      - name: Push storage
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/$STORAGE_IMG_NAME

          # This changes all uppercase characters to lowercase.
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          # This strips the git ref prefix from the version.
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          # This strips the "v" prefix from the tag name.
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
          # This uses the Docker `latest` tag convention.
          [ "$VERSION" == "main" ] && VERSION=latest
          echo IMAGE_ID=$IMAGE_ID
          echo VERSION=$VERSION
          docker tag $STORAGE_IMG_NAME $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION
